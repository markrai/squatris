name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9fa95bf687fa6ae7f2da0673a8067e5fc1515c27
      - uses: lukka/run-cmake@v10
        with:
          configurePreset: windows-release
          buildPreset: windows-release
          testPreset: windows-release

  clang-tidy:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9fa95bf687fa6ae7f2da0673a8067e5fc1515c27
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-release -DSQUATRIS_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_CLANG_TIDY=clang-tidy
      - name: Build with clang-tidy
        shell: pwsh
        run: cmake --build --preset windows-release
